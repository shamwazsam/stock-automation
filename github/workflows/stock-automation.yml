name: Run Stock Automation Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run stock automation script
      env:
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      run: |
        python stock_automation.py | tee output.txt
    
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: automation-output-${{ github.run_id }}
        path: output.txt
        retention-days: 30
    
    - name: Display results
      if: always()
      run: |
        echo "=== STOCK AUTOMATION RESULTS ==="
        cat output.txt
